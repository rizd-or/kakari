<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rizd’or 係決め</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --rail:#191c3a;--rail2:#252950;--railtext:#c9cdf0;
  --bg:#eceef5;--panel:#ffffff;--panel2:#f4f5fa;--ink:#1a1d33;--sub:#686e8f;--line:#e1e4ef;--line2:#cfd3e3;
  --accent:#4655d6;--accentw:#e9ebfc;--brass:#c79a1e;
  --ok:#11956a;--warn:#d98a00;--bad:#e0464c;
  --r1:#11956a;--r2:#2f68f0;--r3:#c99200;--r4:#ec6a2c;--r5:#9b4bd4;--r0:#e0464c;
  --num:"Outfit","Zen Kaku Gothic New",system-ui,sans-serif;
  --sh:0 1px 0 rgba(25,28,58,.04),0 2px 6px -2px rgba(25,28,58,.08);
  --shpop:0 18px 50px -12px rgba(25,28,58,.35);
  color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --rail:#0f1124;--rail2:#1c1f3d;--railtext:#b8bde8;
  --bg:#13152a;--panel:#1b1e36;--panel2:#22264200;--panel2:#23274a;--ink:#e8eaf7;--sub:#9a9fc2;--line:#2c3052;--line2:#3a3f68;
  --accent:#8b96ff;--accentw:#2a2f5e;--brass:#e3bc4a;
  --ok:#2fc28e;--warn:#f0a828;--bad:#ff6b70;
  --r1:#2fc28e;--r2:#6a9bff;--r3:#e8b830;--r4:#ff8a52;--r5:#c38bff;--r0:#ff6b70;
  --sh:0 1px 0 rgba(0,0,0,.2);--shpop:0 20px 60px -10px rgba(0,0,0,.6);
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;resize:vertical}
a{color:var(--accent)}
.k1{--rk:var(--r1)}.k2{--rk:var(--r2)}.k3{--rk:var(--r3)}.k4{--rk:var(--r4)}.k5{--rk:var(--r5)}.k0{--rk:var(--r0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== 枠：ヘッダー ===== */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 20px;height:56px;background:var(--rail);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;letter-spacing:.02em}
.brand small{font-family:var(--num);color:var(--railtext);font-weight:400;font-size:13px;letter-spacing:.04em}
.pill{display:inline-block;font-family:var(--num);font-size:12px;padding:1px 9px;border-radius:999px;background:var(--accentw);color:var(--accent);font-weight:600;vertical-align:1px}
.topbar .pill{background:var(--rail2);color:var(--brass)}
.topright{display:flex;align-items:center;gap:10px}
.presence{display:flex;gap:10px;font-size:12px;color:var(--railtext);white-space:nowrap;background:var(--rail2);border-radius:999px;padding:3px 12px}
.presence[hidden]{display:none}
.presence b{color:#fff;font-family:var(--num);font-size:13px;margin:0 1px}
.save{font-size:12px;color:var(--railtext);white-space:nowrap;display:flex;align-items:center;gap:6px}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--railtext);opacity:.6}
.save.saved::before,.save.local::before{background:#3ad29f;opacity:1}
.save.error::before,.save.offline::before{background:#ff6b70;opacity:1}
.save.dirty::before,.save.saving::before{background:#f0b440;opacity:1}
.topbar .btn{background:var(--rail2);border-color:transparent;color:#fff}
.iconbtn{width:36px;height:36px;border-radius:10px;border:0;background:var(--rail2);color:#fff;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:#343a6e}
.iconbtn svg{width:19px;height:19px}
main{padding:16px 20px 110px;max-width:1720px;margin:0 auto}

/* ===== 枠：下のナビ（ドック） ===== */
.bottomnav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:4px;background:var(--rail);border-radius:16px;padding:5px;box-shadow:var(--shpop);margin-bottom:env(safe-area-inset-bottom)}
.bottomnav button{display:flex;align-items:center;gap:8px;padding:9px 18px;border:0;background:none;border-radius:12px;font-weight:700;color:var(--railtext);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.bottomnav button svg{width:18px;height:18px;flex:none}
.bottomnav button:hover{color:#fff}
.bottomnav button[hidden],.btn[hidden]{display:none}
.bottomnav button.active{background:#fff;color:var(--rail)}

/* ===== ボタン ===== */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:6px 13px;cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--bad)}
.btn.danger.fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:2px 9px;font-size:12px;border-radius:7px}
.x{border:0;background:none;cursor:pointer;color:var(--sub);font-size:16px;line-height:1;padding:0 4px;border-radius:5px}
.x:hover{color:var(--bad)}

/* ===== 集計の帯 ===== */
.summary{display:flex;flex-wrap:wrap;background:var(--panel);border-radius:14px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.stat{flex:1 1 140px;padding:12px 18px;text-align:left;border:0;background:none;border-right:1px solid var(--line);position:relative}
.stat:last-child{border-right:0}
.stat:first-child{flex:1.6 1 220px}
button.stat{cursor:pointer}button.stat:hover{background:var(--panel2)}
.stat .lbl{font-size:12px;color:var(--sub);font-weight:500}
.stat .val{font-family:var(--num);font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .val small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:12px;font-weight:500;color:var(--sub);margin-left:3px;letter-spacing:0}
.stat .sub{font-size:11px;color:var(--sub);font-family:var(--num)}
.stat.warnc .val{color:var(--warn)}.stat.badc .val{color:var(--bad)}.stat.okc .val{color:var(--ok)}
.stat.warnc::after,.stat.badc::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--warn)}
.stat.badc::after{background:var(--bad)}
.stack{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--line);gap:1px}
.stack i{background:var(--rk)}
.bar{position:relative;height:6px;background:var(--line);border-radius:3px;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .3s}
.bar>i.short{background:var(--warn)}.bar>i.over{background:var(--bad)}
.bar .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.4}

.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:12px}
.tgroup{display:flex;flex-wrap:wrap;gap:6px}
.banner{padding:9px 14px;border-radius:12px;margin-bottom:12px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner.lock{background:color-mix(in srgb,var(--ok) 12%,var(--panel));color:var(--ink);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.viewbar{gap:10px}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:live 2s infinite}
@keyframes live{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.pwbox{position:relative;display:flex;flex:1;min-width:0}
.pwbox input{flex:1;padding-right:38px;min-width:0}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:none;color:var(--sub);display:grid;place-items:center;cursor:pointer;border-radius:7px}
.eye:hover{color:var(--accent);background:var(--panel2)}.eye svg{width:18px;height:18px}
.banner.info{background:var(--accentw);color:var(--ink)}

/* ===== 本番ボード ===== */
.cols{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
.panel{background:var(--panel);border-radius:16px;box-shadow:var(--sh)}
.members{position:sticky;top:72px;max-height:calc(100vh - 170px);display:flex;flex-direction:column;overflow:hidden}
.members.dragover{outline:2px dashed var(--bad);outline-offset:2px}
.mhead{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.mhead input[type=search]{width:100%;background:var(--panel2);border-color:transparent;padding:8px 12px}
.mhead .row{display:flex;gap:6px}.mhead .row select{flex:1;font-size:13px}
.frole{font-size:12px;background:var(--accentw);color:var(--accent);font-weight:700;border-radius:8px;padding:5px 9px;display:flex;justify-content:space-between;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--sub);align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rk);margin-right:3px;vertical-align:0}
.mlist{overflow:auto;padding:6px 8px 10px;display:flex;flex-direction:column;gap:2px}
.mcount{font-size:11px;color:var(--sub);padding:2px 6px 4px}
.mcard{border-radius:10px;padding:8px 10px;cursor:pointer;user-select:none;position:relative;transition:background .12s}
.mcard:hover{background:var(--panel2)}
.mcard.sel{background:var(--accentw);box-shadow:inset 0 0 0 1.5px var(--accent)}
.mcard.un::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--warn)}
.mtop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-right:42px}
.mtop b{font-size:14.5px;white-space:nowrap;font-weight:700}
.mtop small{color:var(--sub);font-size:12px}
.mtop .cnt{position:absolute;right:10px;top:9px;font-family:var(--num);font-size:12px;font-weight:600;padding:0 8px;border-radius:999px;background:var(--panel2);color:var(--sub)}
.mtop .cnt.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.mtop .cnt.part{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.mtop .cnt.bad{background:var(--bad);color:#fff}
.tag{font-size:10.5px;padding:0 6px;border-radius:5px;background:var(--panel2);color:var(--sub);white-space:nowrap;line-height:1.7}
.tag.conc{background:color-mix(in srgb,var(--brass) 16%,transparent);color:color-mix(in srgb,var(--brass) 70%,var(--ink))}
.prefs{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}.pref{padding-right:5px}
.pref{font-size:11px;padding:0 6px 0 2px;border-radius:999px;color:var(--sub);white-space:nowrap;display:inline-flex;align-items:center;gap:3px;background:var(--panel2)}
.pref i{font-style:normal;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--rk);color:#fff;font-size:9.5px;font-weight:700;font-family:var(--num)}
.pref.on i{background:#fff;color:var(--rk)}
.pref.on{background:var(--rk);color:#fff;font-weight:700}
.miss{font-size:11.5px;color:var(--bad);margin-top:4px}
.rankline{font-size:11.5px;font-weight:700;color:var(--rk);margin-top:3px}
.note{font-size:12px;color:var(--sub)}

.rolesp{display:flex;flex-direction:column;gap:12px;min-width:0}
.hint{font-size:12.5px;color:var(--sub);border:1.5px dashed var(--line2);border-radius:12px;padding:9px 14px}
.selbar{position:sticky;top:68px;z-index:10;background:var(--rail);color:#fff;border-radius:16px;padding:12px 16px;box-shadow:var(--shpop)}
.selbar .note,.selbar small{color:var(--railtext)}
.selhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.selhead b{font-size:19px}
.selhead .cnt{font-family:var(--num);font-size:13px;color:var(--railtext)}
.selhead .x{margin-left:auto;color:var(--railtext);font-size:20px}
.selbar .warnline{color:#ff9a9e}
.pbtns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pbtn{border:1.5px solid color-mix(in srgb,var(--rk) 70%,transparent);color:#fff;background:transparent;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-weight:700;transition:background .12s}
.pbtn:disabled{cursor:default;opacity:1}.pbtn:hover:not(:disabled){background:color-mix(in srgb,var(--rk) 25%,transparent)}
.pbtn.on{background:var(--rk);border-color:var(--rk)}
.pbtn .rk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--rk);color:#fff;font-family:var(--num);font-size:11px;margin-right:6px}
.pbtn.on .rk{background:#fff;color:var(--rk)}
.selfoot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--railtext)}
.selfoot select{background:var(--rail2);border-color:transparent;color:#fff;font-size:12px;padding:3px 6px}
.selfoot .memo{flex:1;min-width:180px;font-size:12.5px;background:var(--rail2);border-color:transparent;color:#fff}
.selfoot .memo::placeholder{color:var(--railtext);opacity:.7}
.tg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.warnline{font-size:12px;color:var(--bad)}

/* 係カード */
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rcard{background:var(--panel);border-radius:16px;box-shadow:var(--sh);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .15s,transform .15s}
.rcard::before{content:"";position:absolute;left:14px;right:14px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--rc)}

.rcard.over{box-shadow:var(--sh),inset 0 0 0 2px var(--bad)}
.rcard.dragover{box-shadow:0 0 0 3px var(--accent),var(--shpop);transform:translateY(-2px)}
.rhead{display:flex;align-items:flex-end;gap:8px}
.rhead b{font-size:16px;font-weight:700}
.rhead .range{font-family:var(--num);font-size:12px;color:var(--sub)}
.rhead .count{margin-left:auto;font-family:var(--num);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rhead .count small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:11px;color:var(--sub);font-weight:500;margin-left:2px}
.count.short,.remain.short{color:var(--warn)}.count.over,.remain.over{color:var(--bad)}.count.ok{color:var(--ink)}
/* 席メーター：1人＝1マス */
.seats{display:flex;flex-wrap:wrap;gap:3px}
.seat{width:14px;height:14px;border-radius:4px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.seat.on{background:var(--rc);box-shadow:none}
.seat.over{background:var(--bad);box-shadow:none}
.seat.need{background:transparent;box-shadow:none;outline:1.5px dashed var(--warn);outline-offset:-2px}
.seat.open{width:auto;padding:0 5px;font-size:10px;line-height:14px;color:var(--sub);background:none;box-shadow:none;font-family:var(--num)}
.remain{font-size:12px;color:var(--sub);margin-top:-2px}
.demand{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;border:0;background:var(--panel2);border-radius:9px;padding:5px 9px;cursor:pointer;text-align:left;align-items:center}
.demand:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.demand span{color:var(--rk);font-weight:700;font-family:var(--num)}
.demand .pop{margin-left:auto;color:var(--brass);font-weight:700;font-family:inherit;font-size:11px}
.iss{font-size:11.5px;padding:3px 8px;border-radius:7px;font-weight:500}
.iss.req{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.iss.soft{background:color-mix(in srgb,var(--warn) 13%,transparent);color:color-mix(in srgb,var(--warn) 80%,var(--ink))}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:30px;align-content:flex-start;padding-top:2px}
.chips .empty{font-size:12px;color:var(--sub);border:1.5px dashed var(--line2);border-radius:10px;padding:6px 8px;width:100%;text-align:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 3px 2px 2px;border-radius:999px;background:var(--panel2);font-size:12.5px;cursor:grab;font-weight:500}
.chip:active{cursor:grabbing}
.chip .rk{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 3px;font-size:10.5px;font-weight:700;color:#fff;background:var(--rk);border-radius:999px;font-family:var(--num)}
.chip.k0{background:color-mix(in srgb,var(--bad) 10%,var(--panel2))}
.chip.plain{padding:3px 10px;cursor:pointer;background:color-mix(in srgb,var(--rc) 12%,var(--panel2))}
.pref.asg{background:color-mix(in srgb,var(--rc) 16%,var(--panel2));color:var(--ink);font-weight:700;padding:1px 8px;font-size:11.5px}
span.pbtn{cursor:default;padding:4px 14px}
.chip.hl{box-shadow:0 0 0 2px var(--accent)}
.chip.extra{box-shadow:inset 0 0 0 1px var(--line2)}
.chip small{font-size:10px;color:var(--brass);font-weight:700;margin-right:3px}
.chip .x{font-size:13px;padding:0 4px;opacity:.5}.chip:hover .x{opacity:1}
.dpv:empty,.selpv:empty{display:none}
.dpv,.selpv{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;background:var(--accentw);border-radius:10px;padding:6px 8px}
.pv{font-weight:700;color:#fff;background:var(--rk);border-radius:6px;padding:1px 7px}
.pv.same{background:var(--sub)}
.pvc{font-weight:700;font-family:var(--num)}
.pvn{color:var(--bad);font-size:11.5px;font-weight:500}
.selpv .btn{margin-left:auto}
body.dragging .rcard:not(.dragover){opacity:.92}

/* ===== シミュレーション ===== */
.simhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-bottom:12px}
.ptabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);padding:4px;border-radius:12px;box-shadow:var(--sh)}
.ptab{border:0;background:none;border-radius:9px;padding:6px 14px;cursor:pointer;font-weight:700;color:var(--sub)}
.ptab small{font-family:var(--num);font-weight:600;margin-left:6px;color:var(--brass)}
.ptab:hover{color:var(--ink)}
.ptab.active{background:var(--rail);color:#fff}
.planbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.planbar input.pname{font-weight:700;width:170px;font-size:15px}
.planbar input.pmemo{flex:1;min-width:160px}
table.cmp{border-collapse:collapse;width:100%;background:var(--panel);font-size:13px}
.scroll{overflow:auto;border-radius:16px;box-shadow:var(--sh)}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:8px 14px;text-align:center;white-space:nowrap;font-family:var(--num);font-variant-numeric:tabular-nums}
table.cmp th:first-child,table.cmp td:first-child{width:1%;padding-right:28px;text-align:left;position:sticky;left:0;background:var(--panel);font-family:inherit}
table.cmp thead th{background:var(--rail);color:#fff;font-family:inherit;font-weight:700}
table.cmp thead th:first-child{background:var(--rail)}
table.cmp td.best{font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
table.cmp td.short{color:var(--warn);font-weight:700}table.cmp td.over{color:var(--bad);font-weight:700}
table.cmp tr.sect td{background:var(--panel2);font-weight:700;font-size:12px;color:var(--sub)}
.diff{margin-top:14px;background:var(--panel);border-radius:16px;box-shadow:var(--sh);padding:14px 16px}
.diff ul{margin:8px 0 0;padding-left:18px;columns:2 340px}
.diff li{margin:2px 0}

/* ===== 係説明 ===== */
.ghead{padding:8px 0 16px}
.ghead h2{margin:0;font-size:26px;font-weight:700;letter-spacing:.02em}
.ghead p{margin:4px 0 0;color:var(--sub)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.gcard{background:var(--panel);border-radius:18px;box-shadow:var(--sh);padding:18px 18px 16px;position:relative;overflow:hidden}
.gcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--rc)}
.gcard header{display:flex;align-items:center;gap:8px}
.gcard h3{margin:0;font-size:20px;font-weight:700}
.gcard header .btn{margin-left:auto}
.gcard .reqs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.gcard dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.gcard dt{font-size:12px;color:var(--sub);white-space:nowrap;padding-top:1px}
.gcard dd{margin:0}
.gcard .links{margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;font-size:13px}
.gnote{margin-top:16px;background:var(--panel);border-radius:16px;box-shadow:var(--sh);padding:12px 18px;font-size:13px}

/* ===== モーダル ===== */
.modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(17,19,40,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto;animation:fade .15s}
.modal{background:var(--panel);border-radius:20px;width:100%;max-width:520px;box-shadow:var(--shpop);animation:pop .18s ease-out}
.modal.wide{max-width:1140px}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px}
.mhd h2{margin:0;font-size:18px;font-weight:700}
.mbd{padding:4px 20px 20px}
.mft{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.stabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px;background:var(--panel2);padding:4px;border-radius:12px}
.stabs button{border:0;background:none;padding:6px 14px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--sub)}
.stabs button.active{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.stabs button:disabled{opacity:.4}
.form{display:grid;grid-template-columns:210px 1fr;gap:12px 14px;align-items:center}
.form .note{grid-column:2}
.warnt{color:var(--bad)}
.sect{margin:20px 0 8px;font-size:14px;font-weight:700}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:middle}
table.grid th{font-size:12px;color:var(--sub);font-weight:700;background:var(--panel2);position:sticky;top:0;z-index:1}
table.grid input[type=text],table.grid input:not([type]){width:100%}
table.grid input[type=number]{width:66px}
table.grid select{max-width:115px}
table.grid tr.bad td{background:color-mix(in srgb,var(--bad) 8%,transparent)}
.tablebox{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.reqrow{display:flex;gap:4px;align-items:center;margin-bottom:3px}
.reqrow select{max-width:90px}.reqrow input{width:50px}
.chipsline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.drop{border:2px dashed var(--line2);border-radius:16px;padding:26px;text-align:center;background:var(--panel2)}
.cmapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cmapgrid label{display:flex;flex-direction:column;font-size:12px;color:var(--sub);gap:3px}
.okline{color:var(--ok);font-weight:700}
.loglist{max-height:60vh;overflow:auto;font-size:13px;margin:0;padding-left:20px}
.loglist li{margin:3px 0}.loglist time{color:var(--sub);margin-right:8px;font-size:12px;font-family:var(--num)}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exgrid .btn{justify-content:center;padding:12px}

/* 自動配属 */
.amodes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.amodes label{display:grid;grid-template-columns:auto 1fr;gap:2px 9px;border-radius:14px;padding:11px 13px;cursor:pointer;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.amodes label.on{background:var(--rail);color:#fff;box-shadow:none}
.amodes label.on span{color:var(--railtext)}
.amodes input{grid-row:span 2;margin-top:4px;accent-color:var(--brass)}
.amodes span{font-size:12px;color:var(--sub)}
.seg{display:inline-flex;background:var(--panel2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.seg button small{font-weight:500;color:var(--sub);font-size:11px;font-family:var(--num)}
.seg button.on{background:var(--accent);color:#fff}.seg button.on small{color:#dfe1ff}
.basesel{margin-bottom:10px}
.aibox{background:var(--panel2);border-radius:14px;padding:12px 14px;margin-bottom:4px}
.aiexp{margin:0 0 10px;font-size:12.5px;color:var(--sub);line-height:1.7}.aiexp b{color:var(--ink);margin-right:4px}
.aiopts{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px}
.aiopt{display:flex;align-items:center;gap:8px;flex-basis:100%}
.aibox .seg{background:var(--panel)}
.miss-box{background:var(--panel2);border-radius:12px;padding:8px 12px;font-size:13px}.miss-box summary{cursor:pointer;font-weight:700}.miss-box ul{margin:6px 0 0;padding-left:18px;columns:2 320px}
.autogrid{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;margin-top:14px}
.cmpmini td{font-family:var(--num)}.cmpmini td:first-child{font-family:inherit}
.cmpmini td.over{color:var(--bad);font-weight:700}.cmpmini td.short{color:var(--warn);font-weight:700}

.center{display:grid;place-items:center;min-height:62vh}
.card{background:var(--panel);border-radius:20px;box-shadow:var(--sh);padding:28px;max-width:440px;width:100%}
.card h2{margin:0 0 6px;font-size:19px}
.card p{color:var(--sub);font-size:13px}
.card form{display:flex;gap:8px}.card form input{flex:1}
.empty-state{text-align:center;padding:70px 16px;color:var(--sub)}
.empty-state h3{color:var(--ink);font-size:20px;margin:0 0 6px}

#toasts{position:fixed;bottom:84px;right:20px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:flex-end;width:max-content;max-width:92vw}
.toast{background:var(--rail);color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:var(--shpop);display:flex;gap:12px;align-items:center;transition:opacity .3s,transform .3s;animation:pop .2s ease-out}
.toast.warn{background:#6e2a12}
.toast.out{opacity:0;transform:translateY(8px)}
.toast button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:7px;padding:3px 10px;cursor:pointer;white-space:nowrap;font-weight:700}

:root{--gm:#3d7bf0;--gf:#e45d7a}
@media (prefers-color-scheme:dark){:root{--gm:#6f9dff;--gf:#ff7d98}}
.gm{color:var(--gm)}.gf{color:var(--gf)}
.gline{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;font-family:var(--num)}
.gbar{flex:1;display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--line);gap:1px;min-width:40px}
.stat .gbar{margin-top:8px;flex:none}
.gbar b.gm{background:var(--gm)}.gbar b.gf{background:var(--gf)}
.gdot{font-size:10px;font-weight:700;padding:0 5px;border-radius:5px;line-height:1.7}
.gdot.gm{background:color-mix(in srgb,var(--gm) 14%,transparent)}.gdot.gf{background:color-mix(in srgb,var(--gf) 14%,transparent)}
.rhead .prev{font-size:11px;color:var(--sub);background:var(--panel2);border-radius:6px;padding:0 6px;white-space:nowrap;align-self:center}
.pill.prevpill{background:var(--panel2);color:var(--sub)}
.logochip{display:inline-grid;place-items:center;background:#fff;border-radius:9px;padding:2px 6px;height:40px;flex:none}
.logochip img{height:34px;width:auto;display:block}
@media (prefers-color-scheme:dark){.bottomnav{box-shadow:0 0 0 1px var(--line2),var(--shpop)}.topbar{box-shadow:0 1px 0 var(--line)}}
#printArea .plogo{height:34px;vertical-align:middle;margin-right:8px}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;font-size:11pt}
  #printArea h1{font-size:16pt;margin:0 0 8pt}
  #printArea .pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8pt}
  #printArea .pbox{border:1px solid #999;border-radius:4pt;padding:6pt;break-inside:avoid}
  #printArea .pbox h3{margin:0 0 4pt;font-size:12pt}
  #printArea table{border-collapse:collapse;width:100%;margin-top:10pt;font-size:10pt}
  #printArea td,#printArea th{border:1px solid #999;padding:2pt 4pt;text-align:left}
  #printArea .brk{break-before:page}
}

@media (max-width:860px){
  .topbar{padding:0 12px}
  main{padding:12px 10px 100px}
  .cols{grid-template-columns:1fr}
  .members{position:static;max-height:46vh}
  .board.viewer .rolesp{order:-1}
  .selbar{top:62px}
  .form{grid-template-columns:1fr}.form .note{grid-column:1}
  .exgrid,.autogrid,.amodes{grid-template-columns:1fr}
  .brand small{display:none}
  .logochip{height:34px;padding:2px 5px}.logochip img{height:28px}
  .save{display:none}
  .presence .pl{display:none}.presence{gap:8px;padding:3px 9px}
}
@media (max-width:480px){
  .topbar:has(.presence:not([hidden])) #yearLabel{display:none}
  .stat{flex:1 1 33%;padding:10px 12px;border-bottom:1px solid var(--line)}
  .stat:first-child{flex:1 1 100%}
  .stat .val{font-size:22px}
  .bottomnav{left:10px;right:10px;transform:none;bottom:10px}
  .bottomnav button{flex:1;justify-content:center;padding:9px 4px;font-size:12.5px;gap:5px}
  .bottomnav button svg{display:none}
  #toasts{right:50%;transform:translateX(50%);align-items:center;bottom:76px}
}
</style>
</head>

    <span id="presence" class="presence" hidden></span>

</nav>

  const id = opt.id || 'm'; closeModal(id, true);
  const w = document.createElement('div'); w.className = 'modal-wrap'; w.dataset.modal = id;
  w.innerHTML = `<div class="modal ${opt.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mhd"><h2>${esc(title)}</h2><button class="x" data-act="closeModal" aria-label="閉じる">×</button></div><div class="mbd">${body}</div></div>`;
  w.addEventListener('mousedown', e => { if (e.target === w) closeModal(id); });
  $('#modalRoot').appendChild(w); return w;
}
function closeModal(id, silent) {
  const ws = id ? $$(`.modal-wrap[data-modal="${id}"]`) : $$('.modal-wrap').slice(-1);
  ws.forEach(w => { if (w._resolve) w._resolve(false); w.remove(); });

}

function toast(msg, type, action) {
  const box = $('#toasts'); while (box.children.length > 2) box.firstChild.remove();
  const t = document.createElement('div'); t.className = 'toast ' + (type || '');
  t.innerHTML = `<span>${nl2br(esc(msg))}</span>`;
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { action.fn(); t.remove(); }; t.appendChild(b); }

}

/* ----- CSV ----- */
function parseCSV(text) {
  text = text.replace(/^\ufeff/, ''); const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }

}
const toNum = s => ({ '一': 1, '二': 2, '三': 3, '四': 4, '五': 5 }[s] || Number(String(s).normalize('NFKC')));
function matchRole(v) {
  const n = nz(v); if (!n) return null;
  for (const r of state.roles) if (nz(r.name) === n) return r.id;
  for (const r of state.roles) { const b = nz(r.name).replace(/係$/, ''); if (b && n.replace(/係$/, '') === b) return r.id; }
  for (const r of state.roles) { const b = nz(r.name).replace(/係$/, ''); if (b && n.includes(b)) return r.id; }
  return null;
}
function parseRank(v) { const m = String(v || '').normalize('NFKC').match(/([1-5一二三四五])/); return m ? toNum(m[1]) : 0; }
function guessMap(headers) {
  const map = { name: -1, nick: -1, ts: -1, lim: -1, cnt: -1, gender: -1, mode: 'list', rank: [-1, -1, -1, -1, -1], grid: {}, tags: {}, tagVal: {} };
  headers.forEach((h, i) => {
    if (map.ts < 0 && /タイムスタンプ|timestamp/i.test(h)) map.ts = i;
    else if (map.gender < 0 && /性別|gender/i.test(h)) map.gender = i;
    else if (map.lim < 0 && /志望まで|希望まで|第何/.test(h)) map.lim = i;
    else if (map.cnt < 0 && /何個|いくつ|何つ|兼任数/.test(h)) map.cnt = i;
    else if (map.nick < 0 && /あだ名|ニックネーム|呼び名|愛称/.test(h)) map.nick = i;
    else if (map.name < 0 && /名前|氏名|name/i.test(h)) map.name = i;
    const mr = h.normalize('NFKC').match(/第\s*([1-5一二三四五])\s*(希望|志望)/); if (mr && map.rank[toNum(mr[1]) - 1] < 0) map.rank[toNum(mr[1]) - 1] = i;
    const mg = h.match(/[\[［【](.+?)[\]］】]/); if (mg && !mr) { const rid = matchRole(mg[1]); if (rid && map.grid[rid] == null) map.grid[rid] = i; }
    state.tags.forEach(t => { if (map.tags[t] == null && h.includes(t)) map.tags[t] = i; });
  });
  if (Object.keys(map.grid).length >= 2 && map.rank.every(x => x < 0)) map.mode = 'grid';
  return map;
}
function truthy(v, want) {
  v = String(v || '').trim(); if (!v) return false;
  if (want) return nz(v).includes(nz(want));
  return !/^(いいえ|no|なし|無し|無|×|false|0|持っていない|持ってない|違う|ちがう|いない)/i.test(v.normalize('NFKC'));
}
function buildImport() {
  const { headers, rows, map } = csvCtx; const out = []; const issues = []; let skipped = 0;
  rows.forEach((row, ri) => {
    const cell = c => c >= 0 ? (row[c] || '').trim() : '';
    const name = cell(map.name); if (!name) { skipped++; return; }
    const prefs = [null, null, null, null, null]; const probs = [];
    if (map.mode === 'list') map.rank.forEach((c, i) => { const v = cell(c); if (!v) return; const rid = matchRole(v); if (rid) prefs[i] = rid; else probs.push(`第${i + 1}希望「${v}」が係名と一致しません`); });
    else Object.entries(map.grid).forEach(([rid, c]) => { const k = parseRank(cell(c)); if (!k) return; if (prefs[k - 1]) probs.push(`第${k}希望が2つあります`); else prefs[k - 1] = rid; });
    const seen = new Set(); prefs.forEach((p, i) => { if (!p) return; if (seen.has(p)) { probs.push(`${roleName(p)}が重複`); prefs[i] = null; } seen.add(p); });
    if (!prefs.some(Boolean)) probs.push('希望が読み取れません');
    let maxCount = null, maxRank = null;
    if (map.lim >= 0) { const v = cell(map.lim); if (/考えていない|しない|なし|無し|いいえ/.test(v)) maxCount = 1; else if (parseRank(v)) maxRank = parseRank(v); else if (v) probs.push(`兼任の範囲「${v}」が読み取れません`); }
    if (map.cnt >= 0) { const v = cell(map.cnt); const n = parseInt((v.normalize('NFKC').match(/\d+/) || [])[0]); if (n) { if (maxCount === 1 && n > 1) probs.push(`兼任しないと答えているのに${n}つと回答（1つとして扱います）`); else maxCount = n; } else if (v) probs.push(`兼任の個数「${v}」が読み取れません`); }
    const tags = Object.entries(map.tags).filter(([t, c]) => c != null && c >= 0 && truthy(cell(c), map.tagVal[t])).map(([t]) => t);
    const ts = map.ts >= 0 ? Date.parse(cell(map.ts).replace(/\//g, '-').replace(' ', 'T')) || ri : ri;
    const gv = cell(map.gender).normalize('NFKC');
    const gender = /女|female|^f$/i.test(gv) ? 'f' : /男|male|^m$/i.test(gv) ? 'm' : '';
    out.push({ name, nick: cell(map.nick), prefs, tags, ts, ri, probs, maxCount, maxRank, gender });
  });
  const byName = new Map(); let dup = 0;
  out.forEach(x => { const k = nz(x.name); const ex = byName.get(k); if (ex) { dup++; if (x.ts >= ex.ts) { x.pos = ex.pos ?? ex.ri; byName.set(k, x); } } else byName.set(k, x); });
  const members = [...byName.values()].sort((a, b) => (a.pos ?? a.ri) - (b.pos ?? b.ri));
  members.forEach(x => x.probs.forEach(p => issues.push(`${x.name}：${p}`)));
  return { members, issues, dup, skipped, concMapped: map.lim >= 0 || map.cnt >= 0, genderMapped: map.gender >= 0, mappedTags: Object.keys(map.tags).filter(t => map.tags[t] != null && map.tags[t] >= 0) };
}
async function readFileText(file) {

function toCSV(rows) { return '\ufeff' + rows.map(r => r.map(c => { c = String(c ?? ''); return /[",\r\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(',')).join('\r\n'); }

function resultRows(kind, roles, members, asg) {

    return rows;
  }
  const rows = [['名前', 'あだ名', '性別', '担当係', '担当数', '兼任の希望', '第1希望', '第2希望', '第3希望', '第4希望', '第5希望', 'メモ']];
  members.forEach(m => { const rs = asg[m.id] || []; rows.push([m.name, m.nick, gLabel(m.gender), rs.map(x => `${rn(x)}（${rankLabel(rk(m, x))}）`).join('、'), rs.length, concLabel(m), ...[0, 1, 2, 3, 4].map(i => rn(m.prefs[i])), m.memo]); });

/* ドラッグ＆ドロップ */
const mainEl = $('#main');
mainEl.addEventListener('dragstart', e => {
  const chip = e.target.closest('.chip[data-chip]'), mc = e.target.closest('.mcard');
  const key = boardKey(); if (!key || isLocked(key)) { e.preventDefault(); return; }
  if (chip) drag = { mid: chip.dataset.mid, from: chip.dataset.rid, key };
  else if (mc) drag = { mid: mc.dataset.mid, from: null, key };
  else return;
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', drag.mid);
  setTimeout(() => {
    if (!drag) return; document.body.classList.add('dragging');
    const m = memberById(drag.mid), asg = getCtx(key).assignments;
    $$('.rcard').forEach(c => { const r = roleById(c.dataset.rid); const p = $('.dpv', c); if (r && p) p.innerHTML = previewHTML(m, r, asg, drag.from); });
  }, 0);
});
function endDrag() { drag = null; document.body.classList.remove('dragging'); $$('.dpv').forEach(p => p.innerHTML = ''); $$('.dragover').forEach(x => x.classList.remove('dragover')); }
mainEl.addEventListener('dragend', endDrag);
mainEl.addEventListener('dragover', e => {
  if (!drag) return; const card = e.target.closest('.rcard') || (drag.from && e.target.closest('.members'));
  $$('.dragover').forEach(x => { if (x !== card) x.classList.remove('dragover'); });
  if (card) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; card.classList.add('dragover'); }
});
mainEl.addEventListener('drop', e => {
  if (!drag) return; e.preventDefault(); const dr = drag; endDrag();
  const card = e.target.closest('.rcard');
  if (card) { dr.from ? moveMember(dr.key, dr.mid, dr.from, card.dataset.rid) : assign(dr.key, dr.mid, card.dataset.rid); }
  else if (dr.from && e.target.closest('.members')) unassign(dr.key, dr.mid, dr.from);
});

/* キーボード */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('.modal-wrap')) { closeModal(); } else if (ui.selected) { ui.selected = null; render(); } return; }
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || $('.modal-wrap')) return;
  const k = boardKey(); if (!k) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo(k) : undo(k); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(k); }
});
// 自動更新：閲覧中の人は5秒ごと、選管は10秒ごとに確認。画面に戻ったとき・通信が戻ったときもすぐ確認
const onBack = () => { if (document.visibilityState === 'visible') checkRemote(); };
document.addEventListener('visibilitychange', onBack);
window.addEventListener('focus', onBack); window.addEventListener('pageshow', onBack); window.addEventListener('online', onBack);
let pollN = 0;
setInterval(() => { pollN++; if (document.visibilityState === 'visible' && (!auth.authed || pollN % 2 === 0)) checkRemote(true); }, 5000);
window.addEventListener('beforeunload', e => { if (mode === 'server' && meta.dirty && auth.authed) { e.preventDefault(); e.returnValue = ''; } });

/* ===== 起動 ===== */
(function boot() {
  const raw = safeParse(store.get(LS.state)); if (raw) state = normalize(raw);
  const m = safeParse(store.get(LS.meta)); if (m) meta = Object.assign(meta, m);
  mode = gasUrl() ? 'server' : 'local';
  status = mode === 'local' ? 'local' : 'loading';
  auth.authed = mode === 'local' && store.get(LS.key) === CONFIG.PASS_HASH;
  render();
  if (mode === 'server') connect();
})();
</script>
</body>
